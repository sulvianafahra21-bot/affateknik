<style>
/* Affa Teknik — tema toko teknik & bahan bangunan
   Warna diambil dari logo: navy, oranye, perak. */
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap');

:root{
  --navy:#0d2145;--navy-deep:#07142c;--navy-mid:#17336a;
  --orange:#e8532a;--orange-dark:#c5401a;--orange-soft:#fff0ea;
  --steel:#eef1f5;--steel-2:#e1e6ed;--silver:#b9c3d0;
  --paper:#f6f7f9;--ink:#14213d;--muted:#5d6b80;--line:#dde3ea;--white:#fff;
  --ok:#17803f;
  --radius:6px;
  --head:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow',Arial,sans-serif;
  --wrap:1200px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:130px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.hidden{display:none!important}

/* ---------- Header ---------- */
#site-header{display:contents}
.topbar{background:var(--navy-deep);color:#c4cfdf;font-size:13px}
.topbar-inner{max-width:var(--wrap);margin:auto;padding:8px 24px;display:flex;gap:26px;align-items:center}
.topbar-inner span,.topbar-inner a{display:inline-flex;align-items:center;gap:8px}
.topbar-inner svg{width:14px;height:14px;color:var(--orange);flex:none}
.topbar-inner .push{margin-left:auto}
.topbar-inner a:hover{color:#fff}
.header-sticky{position:sticky;top:0;z-index:40;box-shadow:0 2px 0 rgba(13,33,69,.06)}
.header-main{background:#fff;border-bottom:1px solid var(--line)}
.nav-wrap{max-width:var(--wrap);margin:auto;padding:10px 24px;display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:13px;flex:none}
.brand-logo{width:62px;height:62px;border-radius:50%;flex:none}
.brand-name{display:block;white-space:nowrap;font-family:var(--head);font-weight:800;font-size:30px;line-height:1;color:var(--navy);letter-spacing:.2px}
.brand-name b{color:var(--orange);font-weight:800}
.brand-caption{display:block;color:var(--muted);font-size:13px;margin-top:4px;line-height:1}
.header-search{flex:1;display:flex;max-width:520px;margin-left:auto;border:2px solid var(--navy);border-radius:var(--radius);overflow:hidden;background:#fff}
.header-search input{flex:1;min-width:0;border:0;outline:0;padding:0 14px;height:44px;font-size:15px;color:var(--ink)}
.header-search button{border:0;background:var(--navy);color:#fff;padding:0 18px;display:grid;place-items:center;transition:background .2s}
.header-search button:hover{background:var(--orange)}
.header-search svg{width:20px;height:20px}
.nav-actions{display:flex;align-items:center;gap:10px;flex:none}
.wa-link{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:var(--radius);background:#1faa59;color:#fff;font-weight:700;font-size:14px;transition:background .2s}
.wa-link:hover{background:#178a47}
.wa-link svg{width:18px;height:18px}
.cart-link{position:relative;display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 16px;border-radius:var(--radius);background:var(--orange);color:#fff;font-weight:700;font-size:14px;transition:background .2s}
.cart-link:hover{background:var(--orange-dark)}
.cart-link svg{width:20px;height:20px}
.cart-count{display:grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#fff;color:var(--orange-dark);font-size:12px;font-weight:800}
.mobile-menu{display:none;border:2px solid var(--navy);background:#fff;border-radius:var(--radius);width:44px;height:44px;color:var(--navy);place-items:center}
.mobile-menu svg{width:22px;height:22px}
.mainnav{background:var(--navy)}
.nav-links{max-width:var(--wrap);margin:auto;padding:0 24px;display:flex;align-items:stretch}
.nav-links a{display:flex;align-items:center;padding:13px 20px;color:#d5deec;font-weight:600;font-size:15px;border-bottom:3px solid transparent;transition:background .2s,color .2s}
.nav-links a:hover{background:var(--navy-mid);color:#fff}
.nav-links a.active{color:#fff;border-bottom-color:var(--orange);background:var(--navy-mid)}
.nav-links .nav-note{margin-left:auto;display:flex;align-items:center;color:#9fb0cb;font-size:13px;padding-right:0}

/* ---------- Tombol ---------- */
.btn{display:inline-flex;justify-content:center;align-items:center;gap:10px;padding:0 24px;height:50px;border-radius:var(--radius);border:2px solid transparent;font-weight:700;font-size:15px;transition:background .2s,border-color .2s,color .2s,transform .15s}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:hover{background:var(--orange-dark)}
.btn-outline{border-color:var(--navy);color:var(--navy);background:transparent}
.btn-outline:hover{background:var(--navy);color:#fff}
.btn-ghost{border-color:rgba(255,255,255,.4);color:#fff;background:transparent}
.btn-ghost:hover{background:#fff;color:var(--navy)}
.btn-light{background:var(--steel);color:var(--navy)}
.btn-light:hover{background:var(--steel-2)}
.btn-white{background:#fff;color:var(--navy)}
.btn-white:hover{background:var(--navy);color:#fff}
.btn-wa{background:#1faa59;color:#fff}
.btn-wa:hover{background:#178a47}
.btn-danger{background:#fff1f1;border-color:#ffdada;color:#b42318}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- Hero ---------- */
.hero{position:relative;background:var(--navy);color:#fff;overflow:hidden;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px),radial-gradient(ellipse at 78% 45%,#1d4287 0,transparent 60%);
  background-size:44px 44px,44px 44px,100% 100%}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(115deg,var(--orange) 0 26px,var(--navy-deep) 26px 52px)}
.hero-inner{max-width:var(--wrap);margin:auto;padding:76px 24px 100px;display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center}
.hero-tag{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:#ffd2c2;margin-bottom:20px}
.hero-tag:before{content:"";width:34px;height:3px;background:var(--orange)}
.hero h1{font-family:var(--head);font-weight:800;font-size:clamp(46px,6.2vw,82px);line-height:.98;letter-spacing:.3px;margin:0 0 22px}
.hero h1 em{font-style:normal;color:var(--orange)}
.hero-content>p{font-size:19px;line-height:1.65;color:#c9d5e8;max-width:560px;margin:0}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
.hero-visual{position:relative;display:grid;place-items:center;min-height:420px}
.hero-logo{position:relative;width:min(400px,86%);aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 10px rgba(255,255,255,.06),0 30px 80px rgba(0,0,0,.45)}
.hero-ring{position:absolute;inset:-34px;border-radius:50%;border:3px dashed rgba(232,83,42,.75);animation:spin 60s linear infinite}
.hero-ring.r2{inset:-66px;border:1px solid rgba(255,255,255,.18);animation:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Strip info ---------- */
.fact-strip{max-width:var(--wrap);margin:-42px auto 0;padding:0 24px;position:relative;z-index:2}
.fact-grid{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 20px 40px rgba(7,20,44,.12)}
.fact{display:flex;gap:14px;align-items:center;padding:22px 22px;border-right:1px solid var(--line)}
.fact:last-child{border-right:0}
.fact-icon{flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:var(--radius);background:var(--orange-soft);color:var(--orange)}
.fact-icon svg{width:26px;height:26px}
.fact strong{display:block;font-family:var(--head);font-size:21px;line-height:1.1;color:var(--navy);font-weight:700}
.fact span{font-size:14px;color:var(--muted);line-height:1.35;display:block;margin-top:3px}

/* ---------- Section umum ---------- */
.section{max-width:var(--wrap);margin:0 auto;padding:76px 24px}
.section-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:34px}
.section-heading h2,.about-copy h2,.contact-strip h2,.why-head h2{font-family:var(--head);font-weight:800;font-size:clamp(34px,4vw,48px);line-height:1.04;color:var(--navy);margin:0;letter-spacing:.2px}
.section-heading h2:after{content:"";display:block;width:64px;height:5px;background:var(--orange);margin-top:14px}
.section-subtitle{font-size:16px;color:var(--muted);margin:14px 0 0}
.eyebrow{display:block;font-size:15px;font-weight:700;color:var(--orange);margin-bottom:8px}
.text-link{color:var(--orange-dark);font-weight:700;font-size:15px;white-space:nowrap;border-bottom:2px solid transparent}
.text-link:hover{border-bottom-color:var(--orange)}

/* ---------- Kategori ---------- */
.category-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.category-card{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:290px;padding:28px;border-radius:var(--radius);background:var(--navy);color:#fff;overflow:hidden;isolation:isolate;transition:transform .25s}
.category-card:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:30px 30px}
.category-card:after{content:"";position:absolute;left:0;bottom:0;height:5px;width:100%;background:var(--orange);transform:scaleX(.18);transform-origin:left;transition:transform .35s}
.category-card:hover{transform:translateY(-4px)}
.category-card:hover:after{transform:scaleX(1)}
.category-icon{position:absolute;top:26px;right:26px;display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.08);color:var(--orange)}
.category-icon svg{width:46px;height:46px}
.category-card h3{font-family:var(--head);font-size:32px;line-height:1.05;margin:0 0 8px;font-weight:800}
.category-card p{font-size:16px;color:#bccae0;margin:0 0 18px}
.category-arrow{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:#ffd2c2}
.category-arrow svg{width:18px;height:18px;transition:transform .2s}
.category-card:hover .category-arrow svg{transform:translateX(5px)}

/* ---------- Produk ---------- */
.featured-section{background:#fff;max-width:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-left:max(24px,calc((100% - 1152px)/2));padding-right:max(24px,calc((100% - 1152px)/2))}
.product-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.product-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;min-width:0;display:flex;flex-direction:column;transition:border-color .2s,box-shadow .2s}
.product-card:hover{border-color:var(--navy);box-shadow:0 14px 30px rgba(13,33,69,.12)}
.product-image-wrap{height:210px;background:linear-gradient(145deg,#f4f6f9,var(--steel-2));position:relative;overflow:hidden;display:grid;place-items:center;border-bottom:1px solid var(--line)}
.product-image-wrap img{width:100%;height:100%;object-fit:contain;padding:20px;mix-blend-mode:multiply}
.image-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;color:var(--navy-mid);text-align:center;padding:16px;background-image:repeating-linear-gradient(135deg,rgba(13,33,69,.035) 0 12px,transparent 12px 24px)}
.image-placeholder .placeholder-icon{font-size:50px;line-height:1.2;margin-bottom:6px;opacity:.8}
.image-placeholder small{font-size:12px;color:var(--muted);font-weight:600}
.product-badge{position:absolute;top:12px;left:12px;background:var(--navy);color:#fff;border-radius:3px;padding:4px 10px;font-size:12px;font-weight:600;z-index:1}
.product-info{padding:18px;display:flex;flex-direction:column;flex:1}
.product-category{font-size:13px;font-weight:700;color:var(--orange-dark);margin-bottom:4px}
.product-info h3{font-family:var(--head);font-size:23px;line-height:1.12;margin:0 0 8px;color:var(--navy);font-weight:700;min-height:51px}
.product-info h3 a:hover{color:var(--orange-dark)}
.product-meta{font-size:14px;color:var(--muted);margin-bottom:16px}
.product-bottom{display:flex;flex-direction:column;align-items:stretch;gap:12px;margin-top:auto;padding-top:14px;border-top:1px dashed var(--line)}
.price{font-family:var(--head);font-weight:800;font-size:26px;color:var(--navy);line-height:1}
.mini-add{display:inline-flex;justify-content:center;align-items:center;gap:6px;width:100%;border:0;border-radius:var(--radius);background:var(--orange);color:#fff;height:40px;padding:0 14px;font-weight:700;font-size:14px;transition:background .2s}
.mini-add:hover{background:var(--orange-dark)}
.mini-add svg{width:17px;height:17px}

/* ---------- Mengapa ---------- */
.why{background:var(--navy);color:#fff;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:44px 44px}
.why-inner{max-width:var(--wrap);margin:auto;padding:76px 24px;display:grid;grid-template-columns:.8fr 1.2fr;gap:60px;align-items:center}
.why-head h2{color:#fff}
.why-head p{color:#bccae0;font-size:17px;margin:18px 0 28px;max-width:420px}
.why-list{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.why-item{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius);padding:24px}
.why-item svg{width:34px;height:34px;color:var(--orange);margin-bottom:14px}
.why-item h3{font-family:var(--head);font-size:24px;margin:0 0 6px;font-weight:700}
.why-item p{margin:0;font-size:15px;color:#bccae0;line-height:1.55}

/* ---------- Profil ---------- */
.about-section{display:grid;grid-template-columns:340px 1fr;gap:60px;align-items:center}
.about-mark{width:100%;aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 8px var(--steel),0 0 0 10px var(--silver)}
.about-copy p{font-size:17px;color:var(--muted);max-width:620px;margin:18px 0 24px}
.about-copy h2:after{content:"";display:block;width:64px;height:5px;background:var(--orange);margin-top:14px}
.about-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:30px;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
.about-facts div{padding:16px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column}
.about-facts div:last-child{border-right:0}
.about-facts strong{font-family:var(--head);font-size:21px;color:var(--navy);line-height:1.2;font-weight:700}
.about-facts span{font-size:14px;color:var(--muted)}

/* ---------- Kontak ---------- */
.contact-strip{position:relative;background:var(--orange);color:#fff;padding:54px max(24px,calc((100% - 1152px)/2));display:flex;justify-content:space-between;align-items:center;gap:30px;overflow:hidden}
.contact-strip:before{content:"";position:absolute;right:-60px;top:-60px;width:320px;height:320px;border-radius:50%;border:40px solid rgba(255,255,255,.1)}
.contact-strip>*{position:relative}
.contact-strip h2{color:#fff;font-size:clamp(32px,3.6vw,44px)}
.contact-strip p{font-size:17px;color:#ffe9e0;margin:10px 0 0}

/* ---------- Footer ---------- */
#site-footer{background:var(--navy-deep);color:#b4c1d6}
.footer-top{max-width:var(--wrap);margin:auto;padding:56px 24px 40px;display:grid;grid-template-columns:1.5fr 1fr 1fr 1.3fr;gap:44px}
.footer-brand{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.footer-brand img{width:64px;height:64px;border-radius:50%}
.footer-brand strong{font-family:var(--head);font-size:30px;color:#fff;line-height:1;font-weight:800}
.footer-top p{font-size:15px;line-height:1.65;margin:0;max-width:340px}
.footer-top h4{font-family:var(--head);font-size:20px;color:#fff;margin:0 0 16px;font-weight:700;letter-spacing:.3px}
.footer-top ul{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:15px}
.footer-top a:hover{color:#fff}
.footer-contact li{display:flex;gap:10px;align-items:flex-start}
.footer-contact svg{width:18px;height:18px;color:var(--orange);flex:none;margin-top:3px}
.footer-bottom{border-top:1px solid rgba(255,255,255,.1)}
.footer-bottom div{max-width:var(--wrap);margin:auto;padding:18px 24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:14px;color:#8496b2}

/* ---------- Banner halaman dalam ---------- */
.page-banner{position:relative;background:var(--navy);color:#fff;padding:48px max(24px,calc((100% - 1152px)/2)) 52px;display:flex;justify-content:space-between;align-items:center;gap:25px;overflow:hidden;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:40px 40px}
.page-banner:after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(115deg,var(--orange) 0 20px,var(--navy-deep) 20px 40px)}
.page-banner .eyebrow{color:#ffb9a2}
.page-banner h1{font-family:var(--head);font-weight:800;font-size:clamp(38px,5vw,60px);line-height:1;margin:0 0 12px}
.page-banner p{font-size:17px;max-width:560px;color:#c3d0e4;margin:0}
.banner-art{flex:none;width:132px;height:132px;border-radius:50%;box-shadow:0 0 0 6px rgba(255,255,255,.08),0 18px 40px rgba(0,0,0,.35)}
.banner-art img{width:100%;height:100%;border-radius:50%}
.compact-banner{padding-top:36px;padding-bottom:40px}
.compact-banner .banner-art{width:96px;height:96px}

/* ---------- Katalog ---------- */
.catalog-section{padding-top:48px}
.catalog-toolbar{display:flex;justify-content:space-between;align-items:center;gap:20px}
.catalog-toolbar h2{font-family:var(--head);font-weight:800;font-size:38px;color:var(--navy);margin:0;line-height:1}
.search-box{display:flex;align-items:center;gap:9px;width:min(340px,100%);border:2px solid var(--navy);border-radius:var(--radius);padding:0 14px;height:48px;background:#fff;color:var(--navy)}
.search-box svg{width:20px;height:20px;flex:none}
.search-box input{border:0;outline:0;width:100%;min-width:0;color:var(--ink);font-size:15px;background:transparent}
.filter-row{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 30px}
.filter-chip{border:2px solid var(--line);background:#fff;color:var(--navy);border-radius:var(--radius);padding:10px 18px;font-size:15px;font-weight:600;transition:.2s}
.filter-chip:hover{border-color:var(--navy)}
.filter-chip.active{background:var(--navy);border-color:var(--navy);color:#fff}
.empty-state{text-align:center;background:#fff;border:1px dashed var(--silver);border-radius:var(--radius);padding:56px 20px;color:var(--muted)}
.empty-state strong{color:var(--navy);font-size:19px}

/* ---------- Detail produk ---------- */
.breadcrumbs{display:flex;gap:10px;align-items:center;padding-top:26px;padding-bottom:0;font-size:14px;color:var(--muted)}
.breadcrumbs a{color:var(--orange-dark);font-weight:700}
.product-detail-section{padding-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.detail-image{background:linear-gradient(145deg,#f4f6f9,var(--steel-2));border:1px solid var(--line);border-radius:var(--radius);min-height:460px;overflow:hidden;display:grid;place-items:center}
.detail-image img{width:100%;height:460px;object-fit:contain;padding:38px;mix-blend-mode:multiply}
.detail-image .image-placeholder .placeholder-icon{font-size:90px}
.detail-info h1{font-family:var(--head);font-weight:800;font-size:clamp(36px,4vw,52px);line-height:1.02;color:var(--navy);margin:0 0 12px}
.detail-price{font-family:var(--head);font-weight:800;font-size:44px;color:var(--orange-dark);margin:16px 0;line-height:1}
.detail-description{color:var(--muted);font-size:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0;margin:18px 0}
.detail-label{display:block;font-size:15px;font-weight:700;margin-bottom:8px;color:var(--navy)}
.variant-select,.form-control{width:100%;border:2px solid var(--line);background:#fff;border-radius:var(--radius);padding:12px 14px;outline:none;color:var(--ink);font-size:15px;transition:border-color .2s}
.variant-select:focus,.form-control:focus{border-color:var(--navy)}
.quantity-row{display:flex;align-items:center;gap:16px;margin:22px 0}
.quantity-control{display:flex;align-items:center;border:2px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff}
.quantity-control button{border:0;background:var(--steel);width:40px;height:42px;color:var(--navy);font-size:20px;font-weight:700}
.quantity-control button:hover{background:var(--steel-2)}
.quantity-control input{width:48px;text-align:center;border:0;outline:0;font-weight:700;color:var(--navy);font-size:16px}
.detail-actions{display:flex;gap:12px;flex-wrap:wrap}
.detail-actions .btn{flex:1}
.stock-line{font-size:15px;color:var(--ok);font-weight:600;margin:12px 0}
.related-section{border-top:1px solid var(--line)}
.loading-box{text-align:center;padding:60px;color:var(--muted);grid-column:1/-1}

/* ---------- Keranjang & checkout ---------- */
.cart-section{padding-top:36px;min-height:360px}
.checkout-steps{display:flex;justify-content:center;align-items:center;margin:0 auto 38px;max-width:820px}
.step{display:flex;align-items:center;gap:10px;flex:1;position:relative;color:#8b99ad;font-size:15px;font-weight:700}
.step:not(:last-child):after{content:"";height:2px;background:var(--line);position:absolute;left:46px;right:10px;top:50%;z-index:0}
.step span{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid var(--line);z-index:1;font-size:15px}
.step b{background:var(--paper);padding-right:8px;z-index:1;font-weight:700}
.step.active{color:var(--navy)}
.step.active span,.step.done span{background:var(--orange);color:#fff;border-color:var(--orange)}
.step.done{color:var(--navy)}
.cart-layout{display:grid;grid-template-columns:1.6fr .8fr;gap:26px;align-items:start}
.cart-panel,.summary-card,.form-panel,.confirmation-card{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:26px}
.panel-title{font-family:var(--head);font-weight:800;font-size:26px;color:var(--navy);margin:0 0 18px;line-height:1.1}
.cart-item{display:grid;grid-template-columns:96px 1fr auto;gap:18px;padding:18px 0;border-bottom:1px solid var(--line);align-items:center}
.cart-item:first-of-type{padding-top:0}
.cart-item:last-child{border-bottom:0;padding-bottom:0}
.cart-item-image{height:92px;width:96px;border-radius:var(--radius);background:var(--steel);overflow:hidden;display:grid;place-items:center}
.cart-item-image img{width:100%;height:100%;object-fit:contain;padding:8px;mix-blend-mode:multiply}
.cart-item-image .placeholder-icon{font-size:30px}
.cart-item h3{font-family:var(--head);font-size:22px;line-height:1.1;margin:0 0 4px;color:var(--navy);font-weight:700}
.cart-item p{font-size:14px;color:var(--muted);margin:0 0 10px}
.cart-item-price{font-weight:700;font-size:17px;color:var(--navy);white-space:nowrap;text-align:right}
.cart-item-actions{display:flex;align-items:center;gap:14px}
.cart-item-actions .quantity-control button{width:32px;height:32px;font-size:16px}
.cart-item-actions .quantity-control input{width:34px;font-size:14px}
.remove-link{border:0;background:none;color:#b42318;font-size:14px;font-weight:600;padding:4px;text-decoration:underline}
.summary-card{background:var(--navy);color:#fff;border-color:var(--navy)}
.summary-card .panel-title{color:#fff}
.summary-row{display:flex;justify-content:space-between;gap:15px;margin:14px 0;font-size:15px;color:#bccae0}
.summary-row strong{color:#fff;text-align:right}
.summary-total{border-top:1px solid rgba(255,255,255,.18);padding-top:18px;margin-top:18px;font-size:17px;color:#fff;font-weight:700}
.summary-total strong{font-family:var(--head);font-size:30px;color:#ffb597;line-height:1}
.summary-card .btn{width:100%;margin-top:16px}
.small-note{font-size:13px;color:var(--muted);line-height:1.6;margin:14px 0 0}
.summary-card .small-note{color:#9fb0cb}
.empty-cart{text-align:center;padding:60px 20px;border:2px dashed var(--silver);border-radius:var(--radius);background:#fff}
.empty-cart-icon{font-size:48px;margin-bottom:12px}
.empty-cart h2{font-family:var(--head);font-weight:800;font-size:34px;color:var(--navy);margin:0 0 8px}
.empty-cart p{font-size:16px;color:var(--muted);margin:0 0 22px}
.checkout-section{padding-top:36px}
.checkout-layout{display:grid;grid-template-columns:1.25fr .75fr;gap:26px;align-items:start}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-field{display:flex;flex-direction:column;gap:7px}
.form-field.full{grid-column:1/-1}
.form-field label{font-size:14px;font-weight:700;color:var(--navy)}
.form-field .hint{font-size:13px;color:var(--muted);font-weight:400}
.form-actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px}
.form-actions .btn{min-width:150px}
.radio-list{display:grid;gap:12px}
.radio-option{display:flex;align-items:flex-start;gap:12px;border:2px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.2s;background:#fff}
.radio-option:has(input:checked){border-color:var(--orange);background:var(--orange-soft)}
.radio-option input{margin-top:5px;accent-color:var(--orange)}
.radio-option strong{display:block;font-size:16px;color:var(--navy)}
.radio-option small{display:block;color:var(--muted);font-size:14px;margin-top:3px;line-height:1.5}
.order-list{display:grid;gap:12px}
.order-list-item{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px}
.order-thumb{height:52px;width:52px;border-radius:var(--radius);background:var(--steel);overflow:hidden;display:grid;place-items:center}
.order-thumb img{width:100%;height:100%;object-fit:contain;padding:4px;mix-blend-mode:multiply}
.order-thumb .placeholder-icon{font-size:22px}
.order-list-item strong{display:block;font-size:14px;color:#fff;line-height:1.3}
.order-list-item small{font-size:13px;color:#9fb0cb}
.order-list-item .line-price{font-size:14px;font-weight:700;white-space:nowrap;color:#fff}
.form-panel .order-list-item strong,.confirmation-card .order-list-item strong{color:var(--navy)}
.confirmation-card{text-align:center;max-width:700px;margin:0 auto;padding:38px}
.success-icon{width:76px;height:76px;display:grid;place-items:center;background:#e4f8ed;color:var(--ok);border-radius:50%;font-size:36px;margin:0 auto 20px}
.confirmation-card h2{font-family:var(--head);font-weight:800;font-size:38px;color:var(--navy);margin:0 0 9px;line-height:1.05}
.confirmation-card>p{font-size:16px;color:var(--muted);margin:0 0 22px}
.order-number{display:inline-block;padding:10px 18px;background:var(--orange-soft);border:2px dashed var(--orange);border-radius:var(--radius);font-weight:800;color:var(--orange-dark);letter-spacing:.5px;margin-bottom:22px}
.confirmation-details{text-align:left;background:var(--steel);border-radius:var(--radius);padding:20px;margin:0 0 20px}
.confirmation-details .summary-row{margin:9px 0;color:var(--muted)}
.confirmation-details .summary-row strong{color:var(--navy)}
.confirmation-details .summary-total{border-top-color:var(--silver);color:var(--navy)}
.confirmation-details .summary-total strong{color:var(--orange-dark)}
.notice{padding:14px 16px;background:#eef4ff;border-left:4px solid var(--navy-mid);border-radius:4px;color:#27457a;font-size:14px;line-height:1.6;margin:16px 0}
.form-panel .summary-row{color:var(--muted)}
.form-panel .summary-row strong{color:var(--navy)}
.toast{position:fixed;right:22px;bottom:22px;z-index:80;background:var(--navy);color:#fff;padding:14px 20px;border-left:5px solid var(--orange);border-radius:var(--radius);box-shadow:0 14px 34px rgba(7,20,44,.35);font-size:15px;font-weight:500;max-width:calc(100vw - 44px);animation:toast-in .25s ease}
@keyframes toast-in{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}

/* WhatsApp mengambang */
.wa-float{position:fixed;left:20px;bottom:20px;z-index:60;display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:#1faa59;color:#fff;box-shadow:0 10px 26px rgba(7,20,44,.3);transition:transform .2s}
.wa-float:hover{transform:scale(1.07)}
.wa-float svg{width:30px;height:30px}

/* ---------- Header sederhana ---------- */
.nav-wrap{justify-content:space-between}
.top-nav{display:flex;align-items:center;gap:6px;margin-left:auto}
.top-link{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:var(--radius);font-weight:700;font-size:16px;color:var(--navy);transition:background .2s,color .2s}
.top-link:hover{background:var(--steel)}
.top-link.active{background:var(--navy);color:#fff}
.top-link .cart-count{background:var(--orange);color:#fff}
.profile-link{display:grid;place-items:center;width:46px;height:46px;margin-left:8px;border-radius:50%;background:var(--orange);color:#fff;transition:background .2s}
.profile-link:hover{background:var(--orange-dark)}

@media(max-width:760px){

/* ---------- Pembayaran: QRIS & transfer bank ---------- */
.pay-panel{margin:-4px 0 6px;padding:20px;border:2px solid var(--line);border-top:0;border-radius:0 0 var(--radius) var(--radius);background:var(--steel)}
.qris-box{display:grid;place-items:center;margin:0 auto 12px;max-width:300px;min-height:200px;background:#fff;border:2px solid var(--navy);border-radius:var(--radius);padding:14px}
.qris-box img{width:100%;height:auto;border-radius:4px}
.qris-empty{display:flex;flex-direction:column;gap:6px;text-align:center;color:var(--muted);font-size:14px;padding:20px 8px}
.qris-empty strong{color:var(--navy);font-size:16px}
.qris-empty code{background:var(--steel);padding:1px 6px;border-radius:3px;color:var(--navy)}
.bank-list{display:grid;gap:10px}
.bank-row{display:grid;grid-template-columns:auto 76px 1fr auto;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:border-color .2s,background .2s}
.bank-row:has(input:checked){border-color:var(--orange);background:var(--orange-soft)}
.bank-row input{accent-color:var(--orange)}
.bank-list>.bank-row:only-child{grid-template-columns:76px 1fr auto;cursor:default;border-color:var(--orange);background:var(--orange-soft)}
.bank-name{font-family:var(--head);font-weight:800;font-size:22px;color:var(--navy)}
.bank-info{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.bank-info b{font-size:16px;color:var(--navy);letter-spacing:.3px;word-break:break-all}
.bank-info small{color:var(--muted);font-size:13px}
.copy-btn{border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:var(--radius);padding:6px 14px;font-weight:700;font-size:13px;transition:.2s}
.copy-btn:hover{background:var(--navy);color:#fff}
@media(max-width:760px){
  .bank-row{grid-template-columns:auto 1fr auto;grid-template-areas:"r n c" "r i c"}
  .bank-row input{grid-area:r}.bank-name{grid-area:n;font-size:19px}.bank-info{grid-area:i}.copy-btn{grid-area:c}
  .bank-list>.bank-row:only-child{grid-template-columns:1fr auto;grid-template-areas:"n c" "i c"}
}
.bank-info{text-align:left}

/* ---------- Kebijakan retur ---------- */

/* ===== POLISH v3: tampilan lebih profesional ===== */
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
:root{--shadow-sm:0 1px 2px rgba(13,33,69,.06),0 4px 14px rgba(13,33,69,.06);--shadow-md:0 12px 32px rgba(13,33,69,.14)}
.header-sticky{background:rgba(255,255,255,.93);backdrop-filter:saturate(1.4) blur(10px);box-shadow:0 1px 0 var(--line),0 8px 24px rgba(13,33,69,.05)}
.top-link svg{width:22px;height:22px}
.cart-icon-link{position:relative;width:48px;padding:0;justify-content:center;background:var(--navy);color:#fff;margin-left:6px}
.cart-icon-link:hover{background:var(--orange)}.cart-icon-link.active{background:var(--orange)}
.cart-icon-link .cart-count{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;padding:0 4px;font-size:11px;box-sizing:content-box;border:2px solid #fff}
.btn{letter-spacing:.2px;transition:transform .15s,box-shadow .2s,background .2s,color .2s,border-color .2s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}

<script>
(function(){
  const $ = (s,root=document)=>root.querySelector(s);
  const $$ = (s,root=document)=>Array.from(root.querySelectorAll(s));
  const CART_KEY="affaTeknikCart";
  window.AffaCart={
    get(){try{return JSON.parse(localStorage.getItem(CART_KEY)||"[]")}catch(e){return[]}},
    save(items){localStorage.setItem(CART_KEY,JSON.stringify(items));window.dispatchEvent(new Event("cartupdated"));},
    count(){return this.get().reduce((n,i)=>n+i.qty,0)},
    total(){return this.get().reduce((n,i)=>n+i.price*i.qty,0)},
    add(product,variant,qty=1){
      const stock=Number(variant.stock??product.stock);
      const itemId=product.id+"::"+variant.sku;
      const items=this.get();
      const found=items.find(i=>i.itemId===itemId);
      const current=found?found.qty:0;
      if(current+qty>stock){showToast("Jumlah melebihi stok yang tersedia.");return false;}
      if(found)found.qty+=qty;
      else items.push({itemId,productId:product.id,sku:variant.sku,name:product.name,brand:product.brand,variant:variant.label,price:variant.price,stock,image:product.image,icon:product.icon,qty});
      this.save(items);showToast("Produk berhasil ditambahkan ke keranjang.");return true;
    },
    change(itemId,delta){
      const items=this.get(),item=items.find(i=>i.itemId===itemId);if(!item)return;
      item.qty=Math.max(1,Math.min(item.stock,item.qty+delta));this.save(items);
    },
    remove(itemId){this.save(this.get().filter(i=>i.itemId!==itemId));showToast("Produk dihapus dari keranjang.");},
    clear(){localStorage.removeItem(CART_KEY);window.dispatchEvent(new Event("cartupdated"));}
  };
  window.showToast=function(message){
    let toast=$("#site-toast");if(!toast){toast=document.createElement("div");toast.id="site-toast";toast.className="toast";document.body.appendChild(toast);}
    toast.textContent=message;toast.style.display="block";clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>toast.style.display="none",2800);
  };
  window.escapeHTML=function(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));};
  // Mencoba beberapa format gambar otomatis (jpg, jpeg, png, webp, jfif) sebelum menampilkan placeholder.
  const IMG_EXT=["jpg","jpeg","png","webp","jfif","JPG","JPEG","PNG","WEBP"];
  window.affaImgNext=function(img){
    const i=Number(img.dataset.try||0);
    if(i<IMG_EXT.length){img.dataset.try=i+1;img.src=img.dataset.base+"."+IMG_EXT[i];return;}
    img.style.display="none";if(img.nextElementSibling)img.nextElementSibling.style.display="flex";
  };
  window.productImage=function(product,extraClass=""){
    const safe=escapeHTML((window.AFFA_IMGS||{})[product.image]||product.image),base=escapeHTML(String(product.image||"").replace(/\.[^./]+$/,"")),alt=escapeHTML(product.name),icon=escapeHTML(product.icon||"▦");
    return `<img class="${extraClass}" src="${safe}" data-base="${base}" alt="${alt}" onerror="affaImgNext(this)"><div class="image-placeholder" style="display:none"><span class="placeholder-icon">${icon}</span><small>FOTO PRODUK</small></div>`;
  };
  window.productCard=function(p){
    return `<article class="product-card">
      <a class="product-image-wrap" href="#/produk/${encodeURIComponent(p.id)}">${productImage(p)}<span class="product-badge">${escapeHTML(p.category)}</span></a>

      <div class="product-meta">Mulai dari ${formatRupiah(Math.min(...p.variants.map(v=>v.price)))} · Stok ${p.stock}</div>
      <div class="product-bottom"><span class="price">${formatRupiah(p.price)}</span><button class="mini-add" type="button" data-add="${p.id}" aria-label="Tambah ${escapeHTML(p.name)} ke keranjang" title="Tambah ke keranjang">${ICON.plus}<span>Keranjang</span></button><span class="return-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Kebijakan retur 7 hari</span></div></div></article>`;
  };
  const ICON={
    pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
    clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
    search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',
    cart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L20 7H6"/></svg>',
    menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
    wa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.3-5A8.4 8.4 0 1 1 21 11.5z"/><path d="M9 8.5c0 3.5 3 6.500 6.500 6.500l1-1.700-2-1-.9.900a4.600 4.600 0 0 1-2-2l.9-.9-1-2z" fill="currentColor" stroke="none"/></svg>',
    arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>'
  };
  window.AFFA_ICON=ICON;
  const WA_URL="https://wa.me/6285256535824";
  function renderHeader(){
    const el=$("#site-header");if(!el)return;
    const path=window.__page||"index.html";
    const on=f=>path===f?" active":"";
    el.innerHTML=`<div class="header-sticky"><div class="header-main"><div class="nav-wrap">
      <a class="brand" href="#/" aria-label="Affa Teknik — beranda"><img class="brand-logo" src="${AFFA_IMGS['images/logo-affateknik.png']}" alt="Logo Affa Teknik"><span><span class="brand-name">AFFA <b>TEKNIK</b></span><span class="brand-caption">Toko teknik &amp; alat pancing</span></span></a>
      <nav class="top-nav" aria-label="Menu utama"><a class="top-link${on("index.html")}" href="#/">Beranda</a><a class="top-link${on("katalog.html")}" href="#/katalog">Katalog</a><a class="top-link${on("pesanan.html")}" href="#/pesanan">Pesanan</a><a class="top-link" href="#/profil">Tentang Toko</a><a class="top-link cart-icon-link${on("keranjang.html")}" href="#/keranjang" aria-label="Keranjang belanja" title="Keranjang">${ICON.cart}<span class="cart-count" id="header-cart-count">0</span></a><button class="theme-toggle" type="button" aria-label="Ganti mode gelap atau terang" title="Mode gelap / terang"><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></nav>
    </div></div></div>`;
    // tombol WhatsApp mengambang
    if(!$(".wa-float")){const a=document.createElement("a");a.className="wa-float";a.href=WA_URL;a.target="_blank";a.rel="noopener";a.setAttribute("aria-label","Chat WhatsApp Affa Teknik");a.innerHTML=ICON.wa;document.body.appendChild(a);}
  }
  function renderFooter(){
    const el=$("#site-footer");if(!el)return;
    el.innerHTML=`<div class="footer-top">
      <div><div class="footer-brand"><img src="${AFFA_IMGS['images/logo-affateknik.png']}" alt=""><strong>AFFA TEKNIK</strong></div><p>Toko teknik dan alat pancing. Satu toko untuk kebutuhan bangunan, perlengkapan listrik, dan memancing.</p></div>
      <div><h4>Belanja</h4><ul><li><a href="#/katalog">Semua produk</a></li><li><a href="#/katalog/listrik">Perlengkapan listrik</a></li><li><a href="#/katalog/bangunan">Peralatan bangunan</a></li><li><a href="#/katalog/pancing">Alat pancing</a></li></ul></div>
      <div><h4>Halaman</h4><ul><li><a href="#/">Beranda</a></li><li><a href="#/profil">Tentang Toko</a></li><li><a href="#/keranjang">Keranjang belanja</a></li><li><a href="#/pesanan">Riwayat pesanan</a></li></ul></div>

  }
  function updateCartCount(){const el=$("#header-cart-count");if(el){const n=AffaCart.count();el.textContent=n;el.style.display=n?"":"none";}}

  function renderCatalog(){
    const grid=$("#catalog-products");if(!grid)return;
    let active="Semua",query="";
    const update=()=>{
      const found=PRODUK.filter(p=>(active==="Semua"||p.category===active)&&(`${p.name} ${p.brand} ${p.sku} ${p.category}`).toLowerCase().includes(query.toLowerCase()));
      grid.innerHTML=found.map(productCard).join("");$("#product-count").textContent=found.length;$("#empty-products").classList.toggle("hidden",found.length!==0);
    };
    $$(".filter-chip").forEach(btn=>btn.addEventListener("click",()=>{$$(".filter-chip").forEach(b=>b.classList.remove("active"));btn.classList.add("active");active=btn.dataset.filter;update();}));
    $("#product-search")?.addEventListener("input",e=>{query=e.target.value.trim();update();});
    const qp=(window.__route.q||null);if(qp){query=qp.trim();const si=$("#product-search");if(si)si.value=qp;}
    const applyHash=()=>{const m={"#listrik":"Listrik","#bangunan":"Bangunan","#pancing":"Pancing"}[window.__route.hashcat];if(m){const b=$(`.filter-chip[data-filter="${m}"]`);if(b)b.click();}};
    
    const hash=window.__route.hashcat;if(["#listrik","#bangunan","#pancing"].includes(hash)){const cat=hash.slice(1);const filter=cat==="listrik"?"Listrik":cat==="bangunan"?"Bangunan":"Pancing";const btn=$(`.filter-chip[data-filter="${filter}"]`);if(btn)btn.click();}
    update();
  }
  function renderProductDetail(){
    const root=$("#product-detail");if(!root)return;
    const id=window.__route.id||PRODUK[0].id;
    const p=findProduct(id);
    if(!p){root.innerHTML=`<div class="empty-state"><strong>Produk tidak ditemukan.</strong><p>Silakan kembali ke katalog.</p><a class="btn btn-primary" href="#/katalog">Kembali ke katalog</a></div>`;return;}
    root.innerHTML=`<div class="detail-image">${productImage(p)}</div><div class="detail-info"><span class="eyebrow">${escapeHTML(p.category)} · ${escapeHTML(p.brand)}</span><h1>${escapeHTML(p.name)}</h1><div class="product-meta">SKU: ${escapeHTML(p.sku)}</div><div class="detail-price" id="detail-price">${formatRupiah(p.variants[0].price)}</div><div class="stock-line" id="detail-stock">✓ Stok tersedia: ${p.variants[0].stock} pcs</div><p class="detail-description">${escapeHTML(p.description)}</p>

    let index=0,qty=1;
    const variant=()=>p.variants[index];

    $("#variant-select").addEventListener("change",e=>{index=Number(e.target.value);qty=1;sync();});
    $("#qty-minus").addEventListener("click",()=>{qty=Math.max(1,qty-1);sync();});
    $("#qty-plus").addEventListener("click",()=>{qty=Math.min(variant().stock,qty+1);sync();});
    $("#add-detail").addEventListener("click",()=>AffaCart.add(p,variant(),qty));
    $("#buy-now").addEventListener("click",()=>{if(AffaCart.add(p,variant(),qty))location.hash="#/keranjang";});

<script>

    root.innerHTML=`<div class="cart-layout"><div class="cart-panel"><h2 class="panel-title">Produk pilihan (${items.reduce((n,i)=>n+i.qty,0)} item)</h2>${items.map(i=>`<div class="cart-item"><div class="cart-item-image">${productImage(i)}</div><div><h3>${escapeHTML(i.name)}</h3><p>${escapeHTML(i.variant)} · SKU ${escapeHTML(i.sku)}</p><div class="cart-item-actions"><div class="quantity-control"><button type="button" data-change="-1" data-id="${escapeHTML(i.itemId)}" aria-label="Kurangi">−</button><input value="${i.qty}" readonly aria-label="Jumlah"><button type="button" data-change="1" data-id="${escapeHTML(i.itemId)}" aria-label="Tambah">+</button></div><button class="remove-link" data-remove="${escapeHTML(i.itemId)}" type="button">Hapus</button></div></div><div class="cart-item-price">${formatRupiah(i.price*i.qty)}<div style="font-size:10px;color:#8190a3;font-weight:400;margin-top:4px">${formatRupiah(i.price)}/pcs</div></div></div>`).join("")}<a class="text-link" style="display:inline-block;margin-top:20px" href="#/katalog">← Lanjut belanja</a></div>
    <aside class="summary-card"><h2 class="panel-title">Ringkasan belanja</h2><div class="summary-row"><span>Subtotal produk</span><strong>${formatRupiah(total)}</strong></div><div class="summary-row"><span>Pengiriman</span><strong>Dihitung berikutnya</strong></div><div class="summary-row summary-total"><span>Total sementara</span><strong>${formatRupiah(total)}</strong></div><p class="small-note">Biaya pengiriman dihitung setelah kamu memilih metode pengiriman pada tahap checkout.</p><a class="btn btn-primary" href="#/pembayaran">Lanjut ke Pengiriman →</a></aside></div>`;
  }
  root.addEventListener("click",e=>{
    const change=e.target.closest("[data-change]");if(change){AffaCart.change(change.dataset.id,Number(change.dataset.change));return;}
    const remove=e.target.closest("[data-remove]");if(remove){AffaCart.remove(remove.dataset.remove);}
  });
  window.addEventListener("cartupdated",render);
  render();
});
</script>
<script>
/* ==========================================================
   CHECKOUT AFFA TEKNIK
   Alur: 1) Pembayaran  ->  2) Pengiriman  ->  3) Konfirmasi
   ----------------------------------------------------------
   >>> UBAH NOMOR REKENING DI BAWAH INI <<<
   Ganti "number" dan "holder" dengan data rekening toko yang asli.
   Hapus satu baris bank jika tidak dipakai, atau tambah baris baru.
   QRIS: simpan gambar QRIS di folder images/ dengan nama qris.jpg (atau .png/.webp).
   Opsi QRIS hanya tampil otomatis jika gambarnya ada; jika tidak ada, hanya transfer bank.
   ========================================================== */
/* ===== METODE PEMBAYARAN (ubah nomor di sini) =====
   online:true -> pembeli wajib mengunggah bukti pembayaran
   holder      -> nama pemilik (kosongkan jika tidak ingin ditampilkan) */
const PAYMENTS=[
  {id:"cod",name:"Bayar di tempat (COD)",short:"COD",online:false,desc:"Khusus pembeli yang mengambil barang ke toko. Bayar tunai saat barang diambil."},
  {id:"bri",name:"Transfer Bank BRI",short:"BRI",online:true,kind:"Nomor rekening",number:"380601022012533",holder:"Sulviana Fahra",desc:"Transfer ke rekening BRI di bawah ini."},
  {id:"dana",name:"DANA",short:"DANA",online:true,kind:"Nomor DANA",number:"089513615868",holder:"",desc:"Kirim ke nomor DANA di bawah ini."},
  {id:"shopeepay",name:"ShopeePay",short:"SPay",online:true,kind:"Nomor ShopeePay",number:"089513615868",holder:"",desc:"Kirim ke nomor ShopeePay di bawah ini."},
  {id:"seabank",name:"SeaBank",short:"SEA",online:true,kind:"Nomor rekening",number:"901277407050",holder:"",desc:"Transfer ke rekening SeaBank di bawah ini."}
];
const WA_NUMBER="6285256535824";

document.addEventListener("DOMContentLoaded",()=>{
  const $=(s,r=document)=>r.querySelector(s);
  const root=$("#checkout-root");
  if(!root)return;
  const CHECKOUT_KEY="affaTeknikCheckoutDraft";
  let step=1;
  let draft={name:"",phone:"",address:"",district:"",postal:"",shipping:"courier",payment:"bri",notes:""};
  try{draft={...draft,...JSON.parse(sessionStorage.getItem(CHECKOUT_KEY)||"{}")}}catch(e){}
  if(!PAYMENTS.some(p=>p.id===draft.payment))draft.payment="bri";

  const shippingMethods={
    pickup:{label:"Ambil di toko",price:0,description:"Ambil langsung di Affa Teknik, Desa Kupa Dusun Buaka."},
    courier:{label:"Kurir toko (area dekat)",price:10000,description:"Perkiraan biaya Rp10.000."},
    expedition:{label:"Ekspedisi reguler (antar kota)",price:25000,description:"Perkiraan biaya Rp25.000."},
    special:{label:"Pengiriman khusus partai besar",price:50000,description:"Perkiraan biaya Rp50.000; biaya sebenarnya akan dikonfirmasi toko."}
  };

  const saveDraft=()=>sessionStorage.setItem(CHECKOUT_KEY,JSON.stringify(draft));
  const getItems=()=>AffaCart.get();
  const getShipping=()=>shippingMethods[draft.shipping]||shippingMethods.courier;
  const getPay=()=>PAYMENTS.find(p=>p.id===draft.payment)||PAYMENTS[1];
  const subtotal=()=>AffaCart.total();
  const total=()=>subtotal()+getShipping().price;
  const money=n=>formatRupiah(n);
  const paymentLabel=()=>getPay().name;
  const paymentDetail=()=>getPay().online?`${getPay().name} ${getPay().number}`:getPay().name;

  function itemList(){return `<div class="order-list">${getItems().map(i=>`<div class="order-list-item"><div class="order-thumb">${productImage(i)}</div><div><strong>${escapeHTML(i.name)}</strong><small>${escapeHTML(i.variant)} · ${i.qty} pcs</small></div><span class="line-price">${money(i.price*i.qty)}</span></div>`).join("")}</div>`}
  // tahap = "bayar" (ongkir belum dipilih) atau "lengkap"
  function summaryRows(tahap="lengkap"){
    if(tahap==="bayar")return `<div class="summary-row"><span>Subtotal produk</span><strong>${money(subtotal())}</strong></div><div class="summary-row"><span>Ongkos kirim</span><strong>Dipilih di langkah berikutnya</strong></div>`;
    return `<div class="summary-row"><span>Subtotal produk</span><strong>${money(subtotal())}</strong></div><div class="summary-row"><span>${escapeHTML(getShipping().label)}</span><strong>${getShipping().price?money(getShipping().price):"Gratis"}</strong></div><div class="summary-row summary-total"><span>Total pembayaran</span><strong>${money(total())}</strong></div>`;
  }
  function updateProgress(){
    document.querySelectorAll("#checkout-progress .step").forEach(el=>{const n=Number(el.dataset.step);el.classList.toggle("active",n===step);el.classList.toggle("done",n<step);el.querySelector("span").textContent=n<step?"✓":n;});
  }
  function payInfo(p){return p.online?`<div class="bank-list"><div class="bank-row"><span class="bank-name">${escapeHTML(p.short)}</span><span class="bank-info"><small>${escapeHTML(p.kind)}</small><b>${escapeHTML(p.number)}</b>${p.holder?`<small>a.n. ${escapeHTML(p.holder)}</small>`:""}</span><button type="button" class="copy-btn" data-copy="${p.number}">Salin</button></div></div>`:"";}
  let proof=null; // bukti pembayaran {dataUrl,name} disimpan di memori sampai pesanan dikonfirmasi
  function compress(file){return new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=no;fr.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.72));};im.src=fr.result;};fr.readAsDataURL(file);});}
  function render(){
    updateProgress();
    if(!getItems().length){root.innerHTML=`<div class="empty-cart"><div class="empty-cart-icon">🛒</div><h2>Keranjangmu masih kosong</h2><p>Tambahkan produk sebelum melanjutkan checkout.</p><a class="btn btn-primary" href="#/katalog">Kembali ke Katalog</a></div>`;return;}
    if(step===1)renderPayment();
    else if(step===2)renderShipping();
    else renderConfirmation();
  }

  /* ---------- Langkah 1: Pembayaran ---------- */
  function renderPayment(){
    root.innerHTML=`<div class="checkout-layout"><section class="form-panel"><h2 class="panel-title">Pilih metode pembayaran</h2><p class="section-subtitle" style="margin:0 0 20px">Pembayaran online wajib disertai bukti pembayaran, diunggah pada langkah konfirmasi.</p>
    <form id="payment-form"><div class="radio-list">${PAYMENTS.map(p=>`<label class="radio-option"><input type="radio" name="payment" value="${p.id}" ${draft.payment===p.id?"checked":""}><span><strong>${escapeHTML(p.name)}</strong><small>${escapeHTML(p.desc)}</small></span>${p.online?'<em class="pay-tag">Perlu bukti</em>':'<em class="pay-tag tag-store">Bayar di toko</em>'}</label><div class="pay-panel ${draft.payment===p.id?"":"hidden"}" data-panel="${p.id}">${p.online?payInfo(p)+'<p class="small-note">Transfer sesuai total pesanan, lalu unggah bukti pembayaran pada langkah terakhir.</p>':'<p class="small-note" style="margin:0">Pengiriman otomatis menjadi <b>Ambil di toko</b>. Bayar tunai di Affa Teknik saat mengambil barang.</p>'}</div>`).join("")}</div>
    <div class="form-actions"><a class="btn btn-outline" href="#/keranjang">← Kembali ke Keranjang</a><button class="btn btn-primary" type="submit">Lanjut ke Pengiriman →</button></div></form></section>
    <aside class="summary-card"><h2 class="panel-title">Ringkasan belanja</h2>${itemList()}<div style="margin-top:18px">${summaryRows("bayar")}</div></aside></div>`;
    const form=$("#payment-form");
    form.addEventListener("change",e=>{if(e.target.name==="payment"){draft.payment=e.target.value;if(draft.payment==="cod")draft.shipping="pickup";root.querySelectorAll(".pay-panel").forEach(p=>p.classList.toggle("hidden",p.dataset.panel!==draft.payment));saveDraft();}});
    form.addEventListener("click",e=>{const c=e.target.closest(".copy-btn");if(!c)return;e.preventDefault();const v=c.dataset.copy;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>showToast("Nomor disalin."),()=>showToast("Nomor: "+v));});
    form.addEventListener("submit",e=>{e.preventDefault();if(draft.payment==="cod")draft.shipping="pickup";saveDraft();step=2;render();window.scrollTo({top:0,behavior:"smooth"});});
  }

  /* ---------- Langkah 2: Pengiriman ---------- */
  function renderShipping(){
    root.innerHTML=`<div class="checkout-layout"><section class="form-panel"><h2 class="panel-title">Informasi pengiriman</h2><form id="shipping-form" novalidate><div class="demo-bar"><span><b>Mode demo</b> — isi data contoh untuk mencoba alur checkout dengan cepat.</span><button type="button" class="btn btn-light" id="demo-fill">Isi data contoh</button></div><div class="form-grid">
      <div class="form-field"><label for="customer-name">Nama lengkap *</label><input class="form-control" id="customer-name" name="name" required autocomplete="name" value="${escapeHTML(draft.name)}" placeholder="Nama penerima"></div>
      <div class="form-field"><label for="customer-phone">Nomor WhatsApp *</label><input class="form-control" id="customer-phone" name="phone" required inputmode="tel" autocomplete="tel" value="${escapeHTML(draft.phone)}" placeholder="08xxxxxxxxxx"></div>
      <div class="form-field full"><label for="customer-address">Alamat lengkap *</label><textarea class="form-control" id="customer-address" name="address" rows="3" required autocomplete="street-address" placeholder="Nama jalan, nomor rumah, patokan">${escapeHTML(draft.address)}</textarea></div>
      <div class="form-field"><label for="customer-district">Kecamatan / Kota *</label><input class="form-control" id="customer-district" name="district" required value="${escapeHTML(draft.district)}" placeholder="Kecamatan dan kota"></div>
      <div class="form-field"><label for="customer-postal">Kode pos <span class="hint">(opsional)</span></label><input class="form-control" id="customer-postal" name="postal" value="${escapeHTML(draft.postal)}" inputmode="numeric" placeholder="Kode pos"></div>
      <div class="form-field full"><label for="shipping-method">Metode pengiriman *</label><select class="form-control" id="shipping-method" name="shipping" ${draft.payment==="cod"?"disabled":""}>${Object.entries(shippingMethods).map(([key,m])=>`<option value="${key}" ${draft.shipping===key?"selected":""}>${m.label} — ${m.price?money(m.price):"Gratis"}</option>`).join("")}</select><span class="hint">${draft.payment==="cod"?"Metode COD hanya untuk ambil barang di toko.":"Biaya adalah estimasi dan dapat berubah sesuai jarak/ekspedisi."}</span></div>
      <div class="form-field full"><label for="order-notes">Catatan pesanan <span class="hint">(opsional)</span></label><textarea class="form-control" id="order-notes" name="notes" rows="2" placeholder="Catatan untuk penjual">${escapeHTML(draft.notes)}</textarea></div>
      </div><div class="form-actions"><button class="btn btn-outline" type="button" id="back-payment">← Ubah Pembayaran</button><button class="btn btn-primary" type="submit">Lanjut ke Konfirmasi →</button></div></form></section>
      <aside class="summary-card"><h2 class="panel-title">Ringkasan belanja</h2>${itemList()}<div style="margin-top:18px" id="ship-summary">${summaryRows()}</div><p class="small-note">Pembayaran: <strong style="color:#fff">${escapeHTML(paymentLabel())}</strong>. Pastikan alamat dan nomor kontak aktif agar toko dapat menghubungi penerima.</p></aside></div>`;
    const form=$("#shipping-form");
    $("#demo-fill").addEventListener("click",()=>{$("#customer-name").value="Pembeli Demo";$("#customer-phone").value="081234567890";$("#customer-address").value="Jl. Contoh No. 1, dekat pasar";$("#customer-district").value="Barru";showToast("Data demo terisi.");});
    form.shipping.addEventListener("change",e=>{draft.shipping=e.target.value;$("#ship-summary").innerHTML=summaryRows();});
    $("#back-payment").addEventListener("click",()=>{readShipping(form);saveDraft();step=1;render();window.scrollTo({top:0,behavior:"smooth"});});
    form.addEventListener("submit",e=>{
      e.preventDefault();readShipping(form);
      if(!draft.name||!draft.phone||(draft.shipping!=="pickup"&&(!draft.address||!draft.district))){showToast("Lengkapi nama, nomor WhatsApp, alamat, dan kecamatan/kota.");return;}
      if(draft.phone.replace(/\D/g,"").length<9){showToast("Periksa kembali nomor WhatsApp.");return;}
      saveDraft();step=3;render();window.scrollTo({top:0,behavior:"smooth"});
    });
  }
  function readShipping(f){draft.name=f.name.value.trim();draft.phone=f.phone.value.trim();draft.address=f.address.value.trim();draft.district=f.district.value.trim();draft.postal=f.postal.value.trim();draft.shipping=draft.payment==="cod"?"pickup":f.shipping.value;draft.notes=f.notes.value.trim();}

  /* ---------- Langkah 3: Konfirmasi ---------- */
  function waMessage(orderNumber){
    const lines=getItems().map(i=>`- ${i.name} (${i.variant}) x${i.qty}`).join("\n");
    return `Halo Affa Teknik, saya ingin konfirmasi pesanan ${orderNumber}.\n\n${lines}\n\nTotal: ${money(total())}\nPembayaran: ${paymentLabel()}\nPengiriman: ${getShipping().label}\nNama: ${draft.name}\nAlamat: ${draft.address}, ${draft.district}\n\n${getPay().online?"(Bukti pembayaran sudah saya unggah di website.)":"(Pembayaran tunai di toko saat pengambilan barang.)"}`;
  }
  function renderConfirmation(){
    const pay=getPay();
    const orderNumber="AT-"+new Date().toISOString().slice(2,10).replace(/-/g,"")+"-"+Math.random().toString(36).slice(2,6).toUpperCase();
    const order={orderNumber,createdAt:new Date().toLocaleString("id-ID"),customer:{...draft},items:getItems(),subtotal:subtotal(),shipping:getShipping(),total:total(),payment:{label:paymentLabel(),detail:paymentDetail()}};
    sessionStorage.setItem("affaTeknikPendingOrder",JSON.stringify(order));
    const alamat=draft.shipping==="pickup"?"Ambil di toko":`${escapeHTML(draft.address)}, ${escapeHTML(draft.district)}`;
    root.innerHTML=`<div class="confirmation-card"><div class="success-icon">✓</div><span class="eyebrow">Langkah terakhir</span><h2>Konfirmasi pesanan</h2><p>Periksa pesanan${pay.online?", lakukan pembayaran, lalu unggah bukti pembayaran":""}.</p><div class="order-number">${orderNumber}</div>
    <div class="confirmation-details"><div class="summary-row"><span>Metode pembayaran</span><strong>${escapeHTML(paymentLabel())}</strong></div><div class="summary-row"><span>Nama penerima</span><strong>${escapeHTML(draft.name)}</strong></div><div class="summary-row"><span>Nomor kontak</span><strong>${escapeHTML(draft.phone)}</strong></div><div class="summary-row"><span>Alamat</span><strong>${alamat}</strong></div><div class="summary-row"><span>Pengiriman</span><strong>${escapeHTML(getShipping().label)}</strong></div>${summaryRows()}</div>
    ${pay.online?`<div class="proof-box"><h3 class="detail-label">Bayar ${money(total())} ke:</h3>${payInfo(pay)}<label class="proof-drop" for="proof-file"><input type="file" id="proof-file" accept="image/*"><span><b>Unggah bukti pembayaran *</b><small>Foto atau screenshot (JPG/PNG), wajib untuk pembayaran online.</small></span></label><button type="button" class="btn btn-light" id="demo-proof" style="margin-top:12px">Gunakan bukti contoh (demo)</button><div id="proof-preview" class="proof-preview hidden"></div></div>`:`<div class="proof-box"><p class="small-note" style="margin:0">Bayar tunai ${money(total())} di toko saat mengambil barang. Tidak perlu bukti pembayaran online.</p></div>`}
    <div class="form-actions"><button class="btn btn-outline" id="back-shipping">← Ubah Pengiriman</button><button class="btn btn-primary" id="confirm-order" ${pay.online?"disabled":""}>Konfirmasi Pesanan ✓</button></div></div>`;
    proof=null;
    $("#back-shipping").addEventListener("click",()=>{step=2;render();});
    const cb=$(".copy-btn");if(cb)cb.addEventListener("click",e=>{const v=e.currentTarget.dataset.copy;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>showToast("Nomor disalin."),()=>showToast("Nomor: "+v));});
    const showProof=()=>{const pv=$("#proof-preview");pv.classList.remove("hidden");pv.innerHTML=`<img src="${proof.dataUrl}" alt="Bukti pembayaran"><span>${escapeHTML(proof.name)}</span>`;$("#confirm-order").disabled=false;};
    const dp=$("#demo-proof");
    if(dp)dp.addEventListener("click",()=>{const c=document.createElement("canvas");c.width=480;c.height=640;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,480,640);g.fillStyle="#0d2145";g.fillRect(0,0,480,90);g.fillStyle="#fff";g.font="bold 26px Arial";g.fillText("BUKTI PEMBAYARAN",24,56);g.fillStyle="#17803f";g.font="bold 34px Arial";g.fillText("BERHASIL",24,160);g.fillStyle="#14213d";g.font="20px Arial";["Metode : "+paymentLabel(),"Tujuan : "+getPay().number,"Total  : "+money(total()),"Tanggal: "+new Date().toLocaleString("id-ID"),"","*** CONTOH UNTUK DEMO ***"].forEach((t,i)=>g.fillText(t,24,220+i*40));proof={dataUrl:c.toDataURL("image/jpeg",.8),name:"bukti-demo.jpg"};showProof();showToast("Bukti contoh dipakai.");});
    const fi=$("#proof-file");
    if(fi)fi.addEventListener("change",async()=>{
      const f=fi.files[0];if(!f)return;
      if(!/^image\//.test(f.type)||f.size>8*1024*1024){showToast("Unggah gambar (JPG/PNG) maksimal 8 MB.");fi.value="";return;}
      try{proof={dataUrl:await compress(f),name:f.name};}catch(err){showToast("Gambar tidak dapat dibaca. Coba file lain.");return;}
      showProof();
    });
    $("#confirm-order").addEventListener("click",()=>{
      if(pay.online&&!proof){showToast("Unggah bukti pembayaran terlebih dahulu.");return;}
      const status=pay.online?"Menunggu verifikasi pembayaran":"Menunggu pengambilan & pembayaran di toko";
      const finalOrder={...order,status,proofName:proof?proof.name:"",confirmedAt:new Date().toLocaleString("id-ID")};
      let orders=[];try{orders=JSON.parse(localStorage.getItem("affaTeknikOrders")||"[]")}catch(e){}
      if(proof)finalOrder.proof=proof.dataUrl;
      orders.push(finalOrder);
      try{localStorage.setItem("affaTeknikOrders",JSON.stringify(orders));}catch(e){delete finalOrder.proof;try{localStorage.setItem("affaTeknikOrders",JSON.stringify(orders));}catch(e2){}}
      const wa=`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(waMessage(orderNumber))}`;
      root.innerHTML=`<div class="confirmation-card"><div class="success-icon">✓</div><h2>Terima kasih, ${escapeHTML(draft.name)}!</h2><p>${pay.online?"Pesanan dan bukti pembayaran kamu sudah kami terima. Toko akan memverifikasi pembayaran.":"Pesanan kamu sudah dicatat. Silakan ambil barang dan bayar tunai di toko."}</p><div class="order-number">${orderNumber}</div>${proof?`<div class="proof-preview" style="justify-content:center"><img src="${proof.dataUrl}" alt="Bukti pembayaran"><span>Bukti pembayaran terunggah</span></div>`:""}<div class="confirmation-details"><div class="summary-row"><span>Status pesanan</span><strong>${status}</strong></div><div class="summary-row"><span>Metode pembayaran</span><strong>${escapeHTML(paymentLabel())}</strong></div><div class="summary-row"><span>Total pesanan</span><strong>${money(order.total)}</strong></div></div><a class="btn btn-wa" style="width:100%" href="${wa}" target="_blank" rel="noopener">Konfirmasi ke WhatsApp toko</a><div class="form-actions"><a class="btn btn-outline" href="#/">Kembali ke Beranda</a><a class="btn btn-primary" href="#/katalog">Belanja Lagi</a></div></div>`;
      AffaCart.clear();sessionStorage.removeItem(CHECKOUT_KEY);sessionStorage.removeItem("affaTeknikPendingOrder");
      document.querySelectorAll("#checkout-progress .step").forEach(el=>{el.classList.add("done");el.classList.remove("active");el.querySelector("span").textContent="✓";});
      window.scrollTo({top:0,behavior:"smooth"});
    });
  }
  render();
});

</script>
<script>
/* Riwayat pesanan: membaca pesanan yang disimpan checkout di LocalStorage */
document.addEventListener("DOMContentLoaded",()=>{
  const root=document.querySelector("#orders-root");if(!root)return;
  const load=()=>{try{return JSON.parse(localStorage.getItem("affaTeknikOrders")||"[]")}catch(e){return[]}};
  function draw(){
    const list=load().slice().reverse();
    if(!list.length){root.innerHTML=`<div class="empty-cart"><div class="empty-cart-icon">📦</div><h2>Belum ada pesanan</h2><p>Pesanan yang sudah dikonfirmasi akan muncul di sini.</p><a class="btn btn-primary" href="#/katalog">Mulai Belanja</a></div>`;return;}
    root.innerHTML=list.map(x=>`<article class="order-card"><div class="order-card-head"><div><span class="eyebrow">${escapeHTML(x.confirmedAt||x.createdAt||"")}</span><div class="order-number">${escapeHTML(x.orderNumber)}</div></div><span class="status-pill">${escapeHTML(x.status||"")}</span></div>
      <div class="order-list">${x.items.map(i=>`<div class="order-list-item"><div class="order-thumb">${productImage(i)}</div><div><strong>${escapeHTML(i.name)}</strong><small>${escapeHTML(i.variant)} · ${i.qty} pcs</small></div><span class="line-price">${formatRupiah(i.price*i.qty)}</span></div>`).join("")}</div>
      <div class="summary-row"><span>Pembayaran</span><strong>${escapeHTML(x.payment.label)}</strong></div><div class="summary-row"><span>Pengiriman</span><strong>${escapeHTML(x.shipping.label)}</strong></div><div class="summary-row summary-total"><span>Total</span><strong>${formatRupiah(x.total)}</strong></div>
      ${x.proof?`<div class="proof-preview"><img src="${x.proof}" alt="Bukti pembayaran"><span>Bukti pembayaran terunggah</span></div>`:""}</article>`).join("")+`<div class="form-actions"><button class="btn btn-outline" id="clear-orders">Hapus riwayat</button></div>`;
    document.querySelector("#clear-orders").addEventListener("click",()=>{if(confirm("Hapus semua riwayat pesanan di browser ini?")){localStorage.removeItem("affaTeknikOrders");draw();}});
  }
  draw();
});

</script>
<script>
